name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: |
            .cache/eslint
            node_modules/.tmp/*.tsbuildinfo
          key: static-analysis-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'eslint.config.js', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            static-analysis-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'eslint.config.js', 'tsconfig*.json') }}-

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
