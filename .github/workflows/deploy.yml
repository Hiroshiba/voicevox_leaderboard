name: リーダーボードをデプロイ

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: github-api-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/github
          key: github-api-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            github-api-${{ runner.os }}-

      - name: 過去 3 か月の GitHub データを取得
        run: pnpm fetch-data -- --months 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache/save@v4
        with:
          path: .cache/github
          key: github-api-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - id: pages
        uses: actions/configure-pages@v5

      - run: pnpm build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
